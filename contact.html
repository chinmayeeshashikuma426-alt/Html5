<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Chinmayee Shashikumar through an accessible, keyboard-friendly contact form.">
  <meta name="author" content="Chinmayee Shashikumar">
  <meta name="robots" content="index, follow">
  <title>Contact | Chinmayee Shashikumar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="site-header"><div class="container header-inner">
  <a class="logo" href="index.html">Chinmayee</a>
  <nav aria-label="Primary navigation"><ul>
    <li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li>
    <li><a href="projects.html">Projects</a></li><li><a href="contact.html" aria-current="page">Contact</a></li>
  </ul></nav>
</div></header>

<main id="main-content">
  <section class="section" aria-labelledby="contact-title">
    <div class="container narrow">
      <p class="eyebrow">Get in touch</p>
      <h1 id="contact-title">Contact me</h1>
      <p id="form-help">All fields marked with <span aria-hidden="true">*</span> are required.</p>

      <form action="#" method="post" aria-describedby="form-help">
        <div class="form-group">
          <label for="name">Full name <span aria-hidden="true">*</span></label>
          <input id="name" name="name" type="text" autocomplete="name" required aria-required="true">
        </div>
        <div class="form-group">
          <label for="email">Email address <span aria-hidden="true">*</span></label>
          <input id="email" name="email" type="email" autocomplete="email" required aria-required="true" inputmode="email">
        </div>
        <div class="form-group">
          <label for="subject">Subject <span aria-hidden="true">*</span></label>
          <input id="subject" name="subject" type="text" required aria-required="true">
        </div>
        <div class="form-group">
          <label for="message">Message <span aria-hidden="true">*</span></label>
          <textarea id="message" name="message" rows="7" required aria-required="true"></textarea>
        </div>
        <button class="button" type="submit" aria-label="Send contact message">Send message</button>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer"><div class="container"><p>&copy; 2026 Chinmayee Shashikumar.</p></div></footer>
</body>
</html>
